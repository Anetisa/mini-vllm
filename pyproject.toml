[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-vllm"
version = "0.1.0"
description = "An educational LLM inference engine (KV-cache, paged memory, continuous batching) from scratch"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Anetisa" }]
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.5"]

[project.urls]
Repository = "https://github.com/Anetisa/mini-vllm"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
